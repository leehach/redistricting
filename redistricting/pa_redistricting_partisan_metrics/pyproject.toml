[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-redistricting"
version = "0.1.0"
description = "Analyze Pennsylvania Senate citizen redistricting plans"
requires-python = ">=3.11"
dependencies = ["geopandas", "matplotlib", "pandas", "pyogrio", "requests"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
pa-redistricting = "pa_redistricting.cli:main"

[tool.setuptools]
packages = ["pa_redistricting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
